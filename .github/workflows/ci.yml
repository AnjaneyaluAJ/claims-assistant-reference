name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Lint
        run: |
          uv run ruff check src tests scripts
          uv run ruff format --check src tests scripts
      - name: Unit and integration tests
        run: uv run pytest -q
      - name: Evaluation gate (scripted model, architecture checks)
        run: uv run claims-assistant eval
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report
          path: evals/reports/

  # Runs the same evaluation set against Claude when the repository has an API key configured.
  # Model, prompt and tool-description changes should not merge without it.
  model-gate:
    if: ${{ github.event_name == 'pull_request' && vars.RUN_MODEL_GATE == 'true' }}
    runs-on: ubuntu-latest
    needs: test-and-gate
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run claims-assistant eval --provider anthropic --judge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-report-anthropic
          path: evals/reports/
