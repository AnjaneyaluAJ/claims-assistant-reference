[project]
name = "claims-assistant"
version = "0.1.0"
description = "Reference implementation of a production insurance claims assistant: coordinator and domain agents, MCP servers with identity propagation, relationship-based authorization, PII tokenization, evaluation gate and tracing."
readme = "README.md"
authors = [
    { name = "Anjaneyalu Thippaiah" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.6.0",
    "cryptography>=50.0.2",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "httpx2>=2.16.0",
    "mcp>=2.3.0",
    "opentelemetry-api>=1.45.2",
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2.14.3",
    "pyjwt>=2.15.1",
    "pypdf>=7.0.0",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
claims-assistant = "claims_assistant.cli:main"

[build-system]
requires = ["uv_build>=0.9.16,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "S105", "S106", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
